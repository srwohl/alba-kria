# Initial FIM2 bring-up exports a pre-synthesis XSA without PL logic/bitstream.
# xilinx-bootbin otherwise enables a bitstream partition by default whenever
# MACHINE_FEATURES lacks fpga-overlay. Omit that partition and its dependency.
# Applied by make boot with BitBake -R; survives machine regeneration.
BIF_BITSTREAM_ATTR:pn-xilinx-bootbin = ""
