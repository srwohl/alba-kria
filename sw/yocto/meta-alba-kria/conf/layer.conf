# ALBA layer for AMD Kria K26 SOM based boards, on top of AMD EDF.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "alba-kria"
BBFILE_PATTERN_alba-kria = "^${LAYERDIR}/"
# Above the AMD layers (meta-kria is 5), so our settings win.
BBFILE_PRIORITY_alba-kria = "10"

LAYERDEPENDS_alba-kria = "core xilinx"
LAYERSERIES_COMPAT_alba-kria = "scarthgap"
